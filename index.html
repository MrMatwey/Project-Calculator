```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project-Calculator — извлечение корней</title>

<style>
:root{
  --bg:#0b1020; --panel:#121a2e; --panel2:#17213a; --text:#eef3ff;
  --muted:#9eabc6; --accent:#7c8cff; --accent2:#55d6be; --danger:#ff7185;
  --border:#293552; --shadow:0 20px 60px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(124,140,255,.18),transparent 28%),
    radial-gradient(circle at 85% 80%,rgba(85,214,190,.12),transparent 25%),
    var(--bg);
}

header{
  max-width:1180px;
  margin:auto;
  padding:28px 22px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--accent),#9d7cff);
  font-size:23px;
  font-weight:900;
  box-shadow:0 8px 30px rgba(124,140,255,.3);
}

h1{font-size:21px;margin:0}

.subtitle{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.lang{
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  padding:10px 12px;
  border-radius:11px;
}

main{
  max-width:1180px;
  margin:auto;
  padding:16px 22px 42px;
}

.grid{
  display:grid;
  grid-template-columns:390px 1fr;
  gap:18px;
}

.card{
  background:rgba(18,26,46,.92);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:20px;
}

label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin:0 0 8px;
}

input,select,button{
  font:inherit;
  border-radius:12px;
  border:1px solid var(--border);
  outline:none;
}

input,select{
  width:100%;
  padding:13px 14px;
  background:#0e1629;
  color:var(--text);
}

input:focus,select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,140,255,.12);
}

.field{margin-bottom:16px}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.presets{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:8px;
}

.preset{
  padding:7px 10px;
  background:var(--panel2);
  color:#cbd4ea;
  border:1px solid var(--border);
  cursor:pointer;
  font-size:12px;
}

.preset:hover{
  border-color:var(--accent);
}

.actions{
  display:flex;
  gap:9px;
  margin-top:4px;
}

.primary{
  flex:1;
  padding:13px;
  background:linear-gradient(135deg,var(--accent),#9d7cff);
  color:white;
  border:0;
  font-weight:800;
  cursor:pointer;
}

.secondary{
  padding:13px 15px;
  background:#18223a;
  color:#dce4f7;
  cursor:pointer;
}

.primary:hover,.secondary:hover{
  filter:brightness(1.08);
}

.result-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.badge{
  font-size:11px;
  padding:6px 9px;
  border-radius:999px;
  background:rgba(85,214,190,.1);
  color:var(--accent2);
  border:1px solid rgba(85,214,190,.25);
}

.result{
  margin-top:14px;
  min-height:145px;
  border-radius:17px;
  background:#0b1325;
  border:1px solid #253250;
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.expression{
  font-size:15px;
  color:var(--muted);
  word-break:break-all;
}

.answer{
  font-size:32px;
  font-weight:850;
  line-height:1.2;
  margin-top:10px;
  word-break:break-word;
}

.answer.small{
  font-size:22px;
}

.meta{
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
}

.error{
  color:var(--danger);
}

.tabs{
  display:flex;
  gap:7px;
  margin-top:16px;
}

.tab{
  padding:8px 12px;
  border:1px solid var(--border);
  background:#10192d;
  color:var(--muted);
  cursor:pointer;
}

.tab.active{
  color:white;
  border-color:var(--accent);
  background:#1a2440;
}

.panel{
  margin-top:10px;
  padding:15px;
  border:1px solid var(--border);
  border-radius:15px;
  background:#0e172a;
}

.step{
  padding:9px 0;
  border-bottom:1px solid #202b45;
  font-size:13px;
  line-height:1.5;
}

.step:last-child{
  border:0;
}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:14px;
}

.feature{
  padding:13px;
  border:1px solid var(--border);
  border-radius:15px;
  background:rgba(23,33,58,.65);
}

.feature b{
  display:block;
  font-size:13px;
  margin-bottom:4px;
}

.feature span{
  font-size:11px;
  color:var(--muted);
  line-height:1.4;
}

.complex-fields{
  display:none;
}

.complex-fields.show{
  display:block;
}

.support-panel{
  display:none;
}

.support-panel.show{
  display:block;
}

.support-box{
  padding:18px;
  border:1px solid var(--border);
  border-radius:15px;
  background:linear-gradient(135deg,#101a30,#0e172a);
}

.support-phone{
  display:inline-flex;
  align-items:center;
  gap:9px;
  margin-top:14px;
  padding:13px 16px;
  border-radius:12px;
  background:#18223a;
  color:var(--text);
  text-decoration:none;
  font-weight:800;
  border:1px solid var(--border);
}

.support-phone:hover{
  border-color:var(--accent);
  filter:brightness(1.08);
}

.lang-add{
  padding:8px 10px;
  background:#18223a;
  color:#dce4f7;
  border:1px solid var(--border);
  cursor:pointer;
  font-size:12px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(3,7,16,.78);
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(680px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
}

.modal-card h2{
  margin:0 0 7px;
}

.modal-card p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.modal-card textarea{
  width:100%;
  min-height:190px;
  resize:vertical;
  padding:12px 14px;
  background:#0e1629;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
}

.modal-actions{
  display:flex;
  gap:9px;
  justify-content:flex-end;
  margin-top:12px;
}

footer{
  max-width:1180px;
  margin:auto;
  padding:0 22px 35px;
  color:#667391;
  font-size:11px;
  text-align:center;
}

@media(max-width:850px){
  .grid{
    grid-template-columns:1fr;
  }

  .features{
    grid-template-columns:1fr;
  }

  .answer{
    font-size:25px;
  }
}
</style>
</head>
